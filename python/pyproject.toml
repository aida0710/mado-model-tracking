[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mado-tracking"
version = "0.1.0"
description = "Mado Model Tracking Python SDK and durable compute worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
telemetry = ["psutil>=5.9,<8", "nvidia-ml-py>=12,<14"]
# Optional: Run.log_audio / log_image accept numpy arrays and PIL images when these are installed.
media = ["numpy>=1.24", "Pillow>=10"]
# The tests encode numpy arrays and PIL images, so they install the media extra's packages too.
test = ["pytest>=8,<10", "mypy>=1.11,<2", "ruff>=0.9,<1", "numpy>=1.24", "Pillow>=10"]

[project.scripts]
mado-tracking = "mado_tracking.cli:main"
mado-tracking-worker = "mado_tracking.worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mado_tracking = ["py.typed"]

[tool.setuptools.data-files]
"share/mado-tracking/examples" = ["examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mado_tracking"]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
