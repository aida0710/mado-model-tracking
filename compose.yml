services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmt
      POSTGRES_USER: mmt
      POSTGRES_PASSWORD: ${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mmt -d mmt']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4182
      AUTH_MODE: oidc
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
    restart: unless-stopped
  # Generates waveform peaks, spectrograms and video posters with ffmpeg for long audio and video.
  # A separate image so the API carries no ffmpeg; it shares the DB and the Artifact storage.
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    env_file: .env
    environment:
      NODE_ENV: production
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
      # Holds one downloaded source file at a time; it needs room for the largest Artifact.
      - preview-work:/app/var/preview-work
    # Lets the Artifact being processed finish its current step before the container stops.
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on: [api]
    ports: ['127.0.0.1:5182:80']
    restart: unless-stopped
  # Optional: `docker compose --profile worker up -d worker`. The systemd unit (deploy/worker/) is the
  # primary way to run a worker; see docs/operations.md.
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_UID: ${MMT_WORKER_UID:-10001}
        WORKER_GID: ${MMT_WORKER_GID:-10001}
    environment:
      MMT_API_URL: ${MMT_WORKER_API_URL:-http://api:4182}
      MMT_WORKER_ID: ${MMT_WORKER_ID:-compose-worker-1}
      MMT_WORKER_TARGET_IDS: ${MMT_WORKER_TARGET_IDS:-}
    secrets: [mmt_worker_token]
    volumes:
      # The journal of running Jobs; removing the volume abandons them.
      - worker-state:/var/lib/mado-tracking-worker
      # Targets name sshKeyPath / knownHostsPath under /home/worker/.ssh inside the container.
      - ${MMT_WORKER_SSH_DIR:-./var/worker-ssh}:/home/worker/.ssh:ro
    # The worker stops monitoring on SIGTERM and keeps its journal; give it time to flush.
    stop_grace_period: 30s
    restart: unless-stopped
secrets:
  mmt_worker_token:
    file: ${MMT_WORKER_TOKEN_FILE:-./var/worker-token}
volumes:
  postgres:
  artifacts:
  worker-state:
  preview-work:
