services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmt
      POSTGRES_USER: mmt
      POSTGRES_PASSWORD: ${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mmt -d mmt']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4182
      AUTH_MODE: oidc
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
    restart: unless-stopped
  # Generates waveform peaks, spectrograms and video posters with ffmpeg for long audio and video.
  # A separate image so the API carries no ffmpeg; it shares the DB and the Artifact storage.
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    env_file: .env
    environment:
      NODE_ENV: production
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
      # Holds one downloaded source file at a time; it needs room for the largest Artifact.
      - preview-work:/app/var/preview-work
    # Lets the Artifact being processed finish its current step before the container stops.
    stop_grace_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on: [api]
    ports: ['127.0.0.1:5182:80']
    restart: unless-stopped
  # Optional: `docker compose --profile worker up -d worker`. The systemd unit (deploy/worker/) is the
  # primary way to run a worker; see docs/operations.md.
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_UID: ${MMT_WORKER_UID:-10001}
        WORKER_GID: ${MMT_WORKER_GID:-10001}
    environment:
      MMT_API_URL: ${MMT_WORKER_API_URL:-http://api:4182}
      MMT_WORKER_ID: ${MMT_WORKER_ID:-compose-worker-1}
      MMT_WORKER_TARGET_IDS: ${MMT_WORKER_TARGET_IDS:-}
    secrets: [mmt_worker_token]
    volumes:
      # The journal of running Jobs; removing the volume abandons them.
      - worker-state:/var/lib/mado-tracking-worker
      # Targets name sshKeyPath / knownHostsPath under /home/worker/.ssh inside the container.
      - ${MMT_WORKER_SSH_DIR:-./var/worker-ssh}:/home/worker/.ssh:ro
    # The worker stops monitoring on SIGTERM and keeps its journal; give it time to flush.
    stop_grace_period: 30s
    restart: unless-stopped
  # Optional: `docker compose --profile launcher up -d launcher`. Claims site Jobs and runs each
  # site's job shell over SSH; the runner on the compute node reports back. See deploy/sites/.
  launcher:
    profiles: [launcher]
    build:
      context: .
      dockerfile: Dockerfile.launcher
      args:
        LAUNCHER_UID: ${MMT_LAUNCHER_UID:-10002}
        LAUNCHER_GID: ${MMT_LAUNCHER_GID:-10002}
    environment:
      # Names the API (api_url, for example http://api:4182), the token file and the state
      # directory. The sites, job shells and accounts come from the API on each poll.
      MMT_LAUNCHER_CONFIG: /etc/mado-tracking-launcher/launcher.toml
    volumes:
      # launcher.toml (deploy/sites/examples/launcher.toml).
      - ${MMT_LAUNCHER_CONFIG_DIR:-./var/launcher-config}:/etc/mado-tracking-launcher:ro
      # The launcher's token and the registry login that launcher.toml names (mode 600 files).
      - ${MMT_LAUNCHER_SECRETS_DIR:-./var/launcher-secrets}:/run/secrets/mado-tracking-launcher:ro
      # state_directory of launcher.toml: the private SSH keys the launcher makes, the sites'
      # known_hosts, submissions in flight and reports not yet delivered.
      - launcher-state:/var/lib/mado-tracking-launcher
    # SIGTERM stops the launcher after the current poll; a report cut off by the stop is kept in
    # the state volume and sent on the next start.
    stop_grace_period: 30s
    restart: unless-stopped
  # Optional: `docker compose --profile forge up -d forgejo`. Git repositories of job templates,
  # mirrors and the container registry, with Authentik login. See deploy/forgejo/README.md.
  forgejo:
    profiles: [forge]
    image: codeberg.org/forgejo/forgejo:16.0.5-rootless
    environment:
      # Written into app.ini on every start (FORGEJO__<section>__<KEY>). No secret goes here: the
      # secret key is a file, and the OIDC client secret is entered in Forgejo's admin screen.
      FORGEJO__server__DOMAIN: ${MMT_FORGEJO_DOMAIN:-forge.example.org}
      FORGEJO__server__ROOT_URL: https://${MMT_FORGEJO_DOMAIN:-forge.example.org}/
      FORGEJO__server__SSH_DOMAIN: ${MMT_FORGEJO_SSH_DOMAIN:-${MMT_FORGEJO_DOMAIN:-forge.example.org}}
      # Port shown in clone URLs: the host side of the SSH mapping below. The built-in SSH server
      # listens on 2222 inside the container.
      FORGEJO__server__SSH_PORT: ${MMT_FORGEJO_SSH_PORT:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: '2222'
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: 'true'
      # Without a secret key Forgejo falls back to a built-in, publicly known value.
      FORGEJO__security__SECRET_KEY_URI: file:/run/secrets/forgejo_secret_key
      # Accounts are created on the first Authentik (OIDC) login; nobody can sign up otherwise.
      FORGEJO__service__DISABLE_REGISTRATION: 'false'
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: 'true'
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: 'true'
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: 'true'
      FORGEJO__oauth2_client__USERNAME: preferred_username
      FORGEJO__oauth2_client__ACCOUNT_LINKING: login
      # Container registry at https://<MMT_FORGEJO_DOMAIN>/v2/ (images: <domain>/<owner>/<name>).
      FORGEJO__packages__ENABLED: 'true'
    secrets: [forgejo_secret_key]
    volumes:
      # Repositories, packages (container images), the SQLite database and app.ini.
      - forgejo-data:/var/lib/gitea
    ports:
      # The TLS reverse proxy forwards https://<MMT_FORGEJO_DOMAIN>/ (web, git, registry) here.
      - 127.0.0.1:${MMT_FORGEJO_HTTP_PORT:-3000}:3000
      # git over SSH; loopback only until MMT_FORGEJO_SSH_BIND names the address users reach.
      - ${MMT_FORGEJO_SSH_BIND:-127.0.0.1}:${MMT_FORGEJO_SSH_PORT:-2222}:2222
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:3000/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
    # Lets running pushes and pulls finish on shutdown.
    stop_grace_period: 60s
    restart: unless-stopped
secrets:
  mmt_worker_token:
    file: ${MMT_WORKER_TOKEN_FILE:-./var/worker-token}
  # Read by the Forgejo container user (uid 1000); see deploy/forgejo/README.md.
  forgejo_secret_key:
    file: ${MMT_FORGEJO_SECRET_KEY_FILE:-./var/forgejo-secret-key}
volumes:
  postgres:
  artifacts:
  worker-state:
  preview-work:
  launcher-state:
  forgejo-data:
