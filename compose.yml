services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmt
      POSTGRES_USER: mmt
      POSTGRES_PASSWORD: ${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mmt -d mmt']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4182
      AUTH_MODE: oidc
      MMT_DATABASE_URL: postgresql://mmt:${MMT_POSTGRES_PASSWORD:?Set MMT_POSTGRES_PASSWORD}@postgres:5432/mmt
      ARTIFACT_FILESYSTEM_ROOT: /app/var/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/app/var/artifacts
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on: [api]
    ports: ['127.0.0.1:5182:80']
    restart: unless-stopped
volumes:
  postgres:
  artifacts:
