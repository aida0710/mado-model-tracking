# One [[sites]] entry of launcher.toml (../launcher.toml): Grid Engine, with values in the style
# of TSUBAME4.0. Every value is an example. Paste it below the launcher's own settings; relative
# paths start from the directory of launcher.toml.

[[sites]]
# ComputeTarget (executor "site") this entry submits for; copy the ID from the Compute screen.
target_id = "00000000-0000-4000-8000-000000000003"
# "personal": each Job runs as the requester's own account, found by email in [sites.accounts].
# "shared": every Job runs as connection.user.
account_mode = "personal"
# The launcher copies the job shell into work_dir (.mmt-job-shells/<content hash>/job.sh) and
# runs it on the login node for each submission.
job_shell = "grid-engine/job.sh"
# Shared directory that the login and compute nodes see at the same path. Spec directories, the
# runner and caches go below it; an account may name its own (accounts.<email>.work_dir).
work_dir = "/gs/bs/tga-example/mmt"
# Python 3.11 or later that runs the runner on the compute nodes.
runner_python = "/gs/bs/tga-example/mmt/python/bin/python3"
# The tracking API as the compute nodes reach it: the public runner API hostname
# (deploy/edge/README.md). Without it, runners get the project's api_url.
runner_api_url = "https://mmt-runner.example.org"
# Removes a Job canceled while it waits in the queue. MMT_SCHEDULER_JOB_ID is the ID job.sh
# printed; for an array it is the array's job ID, which removes every task.
cancel_command = 'qdel "$MMT_SCHEDULER_JOB_ID"'
# Submissions claimed for this site per poll (1 to 50; an array counts once).
max_active_submissions = 20
# Optional: a read-only registry token for pulling images into SIFs, as JSON
# {"username": ..., "password": ...} in a mode-600 file.
# registry_secret_file = "/run/secrets/mado-tracking-launcher/forge-pull.json"

[sites.connection]
host = "login.hpc.example.org"
port = 22
known_hosts = "/home/launcher/.ssh/known_hosts"
jump_hosts = []

# One table per person, by the email tracking shows for the requester; a requester without one
# fails to submit. The key file is that person's (mode 600, owned by the launcher's user), and
# variables become MMT_VAR_<name> for job.sh: GROUP is the TSUBAME group charged (-g).
[sites.accounts."alice@example.org"]
user = "alice"
identity_file = "/home/launcher/.ssh/tsubame-alice"
variables = { GROUP = "tga-example" }
