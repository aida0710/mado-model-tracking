# Settings of mado-tracking-launcher (--config, or MMT_LAUNCHER_CONFIG). Every value is an
# example. In the site repository this file sits at the top, and each site adds one [[sites]]
# entry below it: the site.toml files beside it are such entries (../README.md). Relative paths
# start from the directory of this file. Tokens live in files outside the repository.

# Stable across restarts: the API ties claimed submissions to it.
launcher_id = "launcher-1"
# Submissions in flight, reports not yet delivered and SSH connection files. Keep it across
# restarts (the compose service mounts a volume here).
state_directory = "/var/lib/mado-tracking-launcher"
poll_seconds = 10

# One entry per Project whose site Jobs this launcher submits. api_url is the API as the launcher
# reaches it; token_file holds a project worker token (a Service Account token with read and
# worker:execute), mode 600 and owned by the launcher's user.
[[projects]]
name = "speech"
api_url = "http://api:4182"
token_file = "/run/secrets/mado-tracking-launcher/speech.token"
